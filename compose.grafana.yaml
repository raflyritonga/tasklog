services:
  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://monitor:${PG_MONITOR_PASSWORD:-monitor}@pg:5432/${POSTGRES_DB:-tasklog}?sslmode=disable
    depends_on:
      pg:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./deploy/o11y/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/o11y/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/o11y/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.0.7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      PG_MONITOR_PASSWORD: ${PG_MONITOR_PASSWORD:-monitor}
    volumes:
      - ./deploy/o11y/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/o11y/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/o11y/grafana/provisioning-k8s/alert-rules.yaml:/etc/grafana/provisioning/alerting/rules.yaml:ro
      - ./deploy/o11y/grafana/provisioning-k8s/dashboard-app.json:/var/lib/grafana/dashboards/app.json:ro
      - ./deploy/o11y/grafana/provisioning-k8s/dashboard-infra.json:/var/lib/grafana/dashboards/infra.json:ro
      - ./deploy/o11y/grafana/provisioning-k8s/dashboard-data.json:/var/lib/grafana/dashboards/data.json:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
