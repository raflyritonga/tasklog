services:
  pg:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasklog}
      POSTGRES_DB: ${POSTGRES_DB:-tasklog}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklog -d tasklog"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ghcr.io/${GHCR_OWNER:-raflyritonga}/tasklog-api:${IMG_TAG:-datadog}
    build: ./app/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tasklog}:${POSTGRES_PASSWORD:-tasklog}@pg:5432/${POSTGRES_DB:-tasklog}?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_OWNER:-raflyritonga}/tasklog-web:${IMG_TAG:-datadog}
    build: ./app/web
    environment:
      NUXT_API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      - api

  report:
    image: ghcr.io/${GHCR_OWNER:-raflyritonga}/tasklog-report:${IMG_TAG:-datadog}
    build: ./app/report
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tasklog}:${POSTGRES_PASSWORD:-tasklog}@pg:5432/${POSTGRES_DB:-tasklog}?sslmode=disable
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      pg:
        condition: service_healthy

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_healthy
      report:
        condition: service_healthy

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg-data:
