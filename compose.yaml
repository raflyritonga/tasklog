services:
  pg:
    image: postgres:16.10-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasklog}
      POSTGRES_DB: ${POSTGRES_DB:-tasklog}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklog -d tasklog"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg-data:
