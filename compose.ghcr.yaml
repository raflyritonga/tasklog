services:
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env.datadog}/tasklog-api:${IMG_TAG:-datadog}
    build: !reset null

  web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env.datadog}/tasklog-web:${IMG_TAG:-datadog}
    build: !reset null

  report:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env.datadog}/tasklog-report:${IMG_TAG:-datadog}
    build: !reset null
