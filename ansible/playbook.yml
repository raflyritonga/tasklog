- hosts: vm
  become: true
  vars:
    kind_version: v0.32.0
    kubectl_version: v1.33.9
    helm_version: v4.2.0
    arch: arm64
    cluster_name: tasklog
  tasks:
    - name: install docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: raise inotify limits
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kind-inotify.conf
        content: |
          fs.inotify.max_user_instances=1024
          fs.inotify.max_user_watches=1048576
          vm.max_map_count=262144
      register: sysctl_conf

    - name: apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed

    - name: install kind
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/kind/releases/download/{{ kind_version }}/kind-linux-{{ arch }}"
        dest: /usr/local/bin/kind
        mode: "0755"
        force: false

    - name: install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        force: false

    - name: install helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
          - "linux-{{ arch }}/helm"
        creates: /usr/local/bin/helm

    - name: render kind config
      ansible.builtin.template:
        src: files/kind-config.yaml.j2
        dest: /root/kind-config.yaml

    - name: list kind clusters
      ansible.builtin.command: kind get clusters
      register: kind_clusters
      changed_when: false

    - name: create kind cluster
      ansible.builtin.command: kind create cluster --name {{ cluster_name }} --config /root/kind-config.yaml --wait 120s
      when: cluster_name not in kind_clusters.stdout_lines

    - name: export kubeconfig
      ansible.builtin.shell: kind get kubeconfig --name {{ cluster_name }} > /root/kubeconfig-{{ cluster_name }}
      changed_when: false

    - name: fetch kubeconfig to repo root
      ansible.builtin.fetch:
        src: /root/kubeconfig-{{ cluster_name }}
        dest: ../kubeconfig
        flat: true
