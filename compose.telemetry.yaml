services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DT_API_TOKEN: ${DT_API_TOKEN:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
    volumes:
      - ./deploy/o11y/otel-collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8888:8888"
    depends_on:
      - tempo

  vector:
    image: timberio/vector:0.57.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./deploy/o11y/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
