services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DT_API_TOKEN: ${DT_API_TOKEN:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
    volumes:
      - ./deploy/compose/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:8889:8889"
    depends_on:
      - tempo

  vector:
    image: timberio/vector:0.57.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      ELASTIC_API_KEY: ${ELASTIC_API_KEY:-}
    volumes:
      - ./deploy/compose/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./deploy/compose/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/compose/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/compose/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.0.7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3001:3000"
