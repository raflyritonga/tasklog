apiVersion: 1

groups:
  - orgId: 1
    name: tasklog
    folder: tasklog
    interval: 1m
    rules:
      - uid: tasklog-5xx-ratio
        title: api 5xx ratio above 5 percent
        condition: C
        for: 5m
        labels:
          severity: page
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: 100 * sum(rate(http_server_request_count_total{status=~"5.."}[5m])) / sum(rate(http_server_request_count_total[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: tasklog-p95-latency
        title: api p95 latency above 800ms
        condition: C
        for: 5m
        labels:
          severity: page
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{route!=""}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]

      - uid: tasklog-scrape-down
        title: api metrics pipeline scrape target down
        condition: C
        for: 2m
        labels:
          severity: page
        noDataState: Alerting
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: up{job="otel-collector"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: tasklog-pg-connections
        title: postgres connections above 80 percent of max
        condition: C
        for: 10m
        labels:
          severity: ticket
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: 100 * sum(pg_stat_activity_count{datname="tasklog"}) / max(pg_settings_max_connections)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]

      - uid: tasklog-cpu-throttling
        title: container cpu throttling above 25 percent
        condition: C
        for: 10m
        labels:
          severity: ticket
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: sum(rate(container_cpu_cfs_throttled_periods_total{namespace="tasklog"}[5m])) / sum(rate(container_cpu_cfs_periods_total{namespace="tasklog"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.25]
