global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: otelcol-internal
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: vector
    static_configs:
      - targets: ['vector:9598']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
