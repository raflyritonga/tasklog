[[tests]]
name = "normalize builds one canonical request event"

[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = "{\"ts\":\"2026-08-27T14:26:21.642747182Z\",\"level\":\"INFO\",\"msg\":\"GET /api/tasks\",\"service\":\"tasklog-api\",\"route\":\"/api/tasks\",\"status\":200,\"duration_ms\":0.534,\"trace_id\":\"00000000000000000faa62aeea08cf8a\",\"span_id\":\"4cd2be36bf6598bf\",\"client_ip\":\"192.168.139.3\",\"dd\":{\"trace_id\":\"1128823160000008074\",\"span_id\":\"5535696034340378815\"}}"
"kubernetes.pod_name" = "api-6c95fb88db-8gjwv"
"kubernetes.pod_namespace" = "tasklog"
"kubernetes.container_name" = "api"
"kubernetes.pod_node_name" = "tasklog-worker"
"kubernetes.pod_owner" = "ReplicaSet/api-6c95fb88db"
"kubernetes.container_image" = "ghcr.io/raflyritonga/tasklog-api:dev"
"kubernetes.pod_labels.app" = "api"
file = "/var/log/pods/x/api/0.log"
stream = "stdout"
source_type = "kubernetes_logs"

[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "GET /api/tasks" && !exists(.msg) && !exists(.kubernetes) && !exists(.file) && .k8s.pod == "api-6c95fb88db-8gjwv" && .version == "dev" && .service == "tasklog-api" && .level == "info"
'''

[[tests]]
name = "normalize passes a non-JSON line through untouched"

[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = "2026-08-27 checkpoint complete: wrote 42 buffers"
"kubernetes.container_name" = "pg"
"kubernetes.pod_namespace" = "tasklog"

[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "2026-08-27 checkpoint complete: wrote 42 buffers" && .service == "pg" && .level == "info"
'''

[[tests]]
name = "drop_noise drops a probe"
no_outputs_from = ["drop_noise"]

[[tests.inputs]]
insert_at = "drop_noise"
type = "log"
[tests.inputs.log_fields]
route = "/healthz"
message = "GET /healthz"

[[tests]]
name = "drop_noise passes a request"

[[tests.inputs]]
insert_at = "drop_noise"
type = "log"
[tests.inputs.log_fields]
route = "/api/tasks"
message = "GET /api/tasks"

[[tests.outputs]]
extract_from = "drop_noise"
[[tests.outputs.conditions]]
type = "vrl"
source = '.route == "/api/tasks"'

[[tests]]
name = "shape_loki drops dd, keeps w3c trace id"

[[tests.inputs]]
insert_at = "shape_loki"
type = "log"
[tests.inputs.log_fields]
trace_id = "00000000000000000faa62aeea08cf8a"
"dd.trace_id" = "1128823160000008074"
"k8s.workload" = "ReplicaSet/api"
"k8s.pod" = "api-1"
version = "dev"

[[tests.outputs]]
extract_from = "shape_loki"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
!exists(.dd) && !exists(.k8s.workload) && !exists(.version) && .trace_id == "00000000000000000faa62aeea08cf8a" && .k8s.pod == "api-1"
'''

[[tests]]
name = "shape_elastic maps to ECS"

[[tests.inputs]]
insert_at = "shape_elastic"
type = "log"
[tests.inputs.log_fields]
level = "info"
service = "tasklog-api"
env = "dev"
version = "dev"
route = "/api/tasks"
status = 200
duration_ms = 0.534
