
[transforms.shape_datadog]
type = "remap"
inputs = ["drop_noise"]
source = '''
st = del(.status)
if st != null { .http = {"status_code": st} }
.status = del(.level)
cip = del(.client_ip)
if cip != null { .network = {"client": {"ip": cip}} }
d = float(.duration_ms) ?? -1.0
if d >= 0.0 { .duration = to_int(d * 1000000.0) }
del(.duration_ms)
del(.trace_id)
del(.span_id)
.ddsource = "vector"
.hostname = string(.k8s.node) ?? "unknown"
env_v = string(.env) ?? "dev"
ver = string(.version) ?? "unknown"
ns = string(.k8s.namespace) ?? "unknown"
pod = string(.k8s.pod) ?? "unknown"
.ddtags = "env:" + env_v + ",version:" + ver + ",kube_namespace:" + ns + ",pod_name:" + pod
del(.k8s)
del(.env)
del(.version)
'''

[sinks.datadog]
type = "datadog_logs"
inputs = ["shape_datadog"]
default_api_key = "__DD_API_KEY__"
site = "__DD_SITE_FULL__"
compression = "gzip"
