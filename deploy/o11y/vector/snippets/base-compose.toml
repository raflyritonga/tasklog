[sources.docker]
type = "docker_logs"
include_labels = ["com.docker.compose.project=tasklog"]

[sources.internal]
type = "internal_metrics"

[sinks.prom_exporter]
type = "prometheus_exporter"
inputs = ["internal"]
address = "0.0.0.0:9598"

[transforms.normalize]
type = "remap"
inputs = ["docker"]
source = '''
raw, err = parse_json(string(.message) ?? "")
if err == null && is_object(raw) {
  . = merge(., object!(raw))
  m = del(.msg)
  if m != null { .message = m }
}
ts = string(.ts) ?? ""
if ts != "" {
  parsed_ts, terr = parse_timestamp(ts, "%+")
  if terr == null { .timestamp = parsed_ts }
  del(.ts)
}
.service = string(.service) ?? (string(.label."com.docker.compose.service") ?? "unknown")
.level = downcase(string(.level) ?? "info")
.env = "dev"
img = string(.image) ?? ""
if contains(img, ":") {
  .version = replace(img, r'^.*:', "")
} else {
  .version = "unknown"
}
.k8s = {
  "namespace": "compose",
  "pod": string(.container_name) ?? "unknown",
  "container": string(.container_name) ?? "unknown",
  "node": string(.host) ?? "docker",
  "workload": "compose"
}
del(.container_created_at)
del(.container_id)
del(.label)
del(.image)
del(.source_type)
del(.stream)
'''

[transforms.drop_noise]
type = "filter"
inputs = ["normalize"]
condition = '''
route = string(.route) ?? ""
!includes(["/healthz", "/readyz", "/livez"], route)
'''

[transforms.shape_loki]
type = "remap"
inputs = ["drop_noise"]
source = '''
del(.dd)
del(.k8s.workload)
del(.version)
'''

[sinks.loki]
type = "loki"
inputs = ["shape_loki"]
endpoint = "http://loki:3100"
encoding.codec = "json"
remove_label_fields = true
dangerously_allow_unconfined_template_resolution = true

[sinks.loki.labels]
service = "{{ service }}"
namespace = "{{ k8s.namespace }}"
container = "{{ k8s.container }}"
level = "{{ level }}"
env = "{{ env }}"
