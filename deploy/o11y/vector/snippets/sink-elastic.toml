# ECS shaping. client_ip becomes client.ip - the field the tasklog-logs ingest
# pipeline's geoip processor reads; rename here and there together. event.duration
# is nanoseconds, ECS convention (duration_ms x 1,000,000).
[transforms.shape_elastic]
type = "remap"
inputs = ["drop_noise"]
source = '''
."@timestamp" = del(.timestamp)
lvl = del(.level)
if lvl != null { .log = {"level": lvl} }
svc = del(.service)
if svc != null { .service = {"name": svc} }
env_v = del(.env)
if env_v != null { .service.environment = env_v }
ver = del(.version)
if ver != null { .service.version = ver }
tid = string(del(.trace_id)) ?? ""
if tid != "" { .trace = {"id": tid} }
sid = string(del(.span_id)) ?? ""
if sid != "" { .span = {"id": sid} }
del(.dd)
rt = del(.route)
if rt != null { .url = {"path": rt} }
st = del(.status)
if st != null { .http = {"response": {"status_code": st}} }
cip = del(.client_ip)
if cip != null { .client = {"ip": cip} }
d = float(.duration_ms) ?? -1.0
if d >= 0.0 { .event = {"duration": to_int(d * 1000000.0)} }
del(.duration_ms)
.kubernetes = {
  "namespace": .k8s.namespace,
  "pod": {"name": .k8s.pod},
  "container": {"name": .k8s.container},
  "node": {"name": .k8s.node}
}
del(.k8s)
'''

# data_stream mode writes logs-tasklog.api-dev. Credentials are substituted at
# render time (Vector 0.57 does not interpolate env vars); the rendered file is
# a k8s Secret, never a ConfigMap.
[sinks.elastic]
type = "elasticsearch"
inputs = ["shape_elastic"]
endpoints = ["__ELASTIC_ES_ENDPOINT__"]
api_version = "auto"
mode = "data_stream"
pipeline = "tasklog-logs"

[sinks.elastic.data_stream]
type = "logs"
dataset = "tasklog.api"
namespace = "dev"

[sinks.elastic.auth]
strategy = "basic"
user = "__ELASTIC_ES_USER__"
password = "__ELASTIC_ES_PASSWORD__"
