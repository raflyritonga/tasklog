apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: o11y
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: o11y
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: o11y
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector
          image: timberio/vector:0.57.0-alpine
          args:
            - --config
            - /etc/vector/vector.toml
          envFrom:
            - secretRef:
                name: o11y-vendors
                optional: true
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9598
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: vector-config
        - name: var-log
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: o11y
spec:
  selector:
    app: vector
  ports:
    - name: metrics
      port: 9598
      targetPort: 9598
