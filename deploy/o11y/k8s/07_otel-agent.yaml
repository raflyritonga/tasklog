apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: o11y
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      labels:
        app: otel-agent
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: otel-agent
        - name: hostfs
          hostPath:
            path: /
