receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem: {}
      network: {}
  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: https://${env:NODE_IP}:10250
    insecure_skip_verify: true
    metric_groups:
      - node
      - pod
      - container

processors:
  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]
  cumulativetodelta: {}
  batch: {}

exporters:
  elasticsearch/otel:
    endpoints:
      - __ELASTIC_ES_ENDPOINT__
    user: __ELASTIC_ES_USER__
    password: __ELASTIC_ES_PASSWORD__
    mapping:
      mode: otel
    flush:
      interval: 5s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [hostmetrics, kubeletstats]
      processors: [resourcedetection/system, cumulativetodelta, batch]
      exporters: [elasticsearch/otel]
