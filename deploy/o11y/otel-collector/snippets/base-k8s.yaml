receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    allocatable_types_to_report: [cpu, memory]
    node_conditions_to_report: [Ready, MemoryPressure]

processors:
  resource/tasklog_ds:
    attributes:
      - key: data_stream.dataset
        value: tasklog
        action: upsert
  cumulativetodelta: {}
  filter/probe_noise:
    error_mode: ignore
    traces:
      span:
        - IsRootSpan() and (name == "ping" or name == "redis.dial")
  k8sattributes:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
