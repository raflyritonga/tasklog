  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: __DD_SITE_FULL__
    traces:
      compute_stats_by_span_kind: true
      peer_tags_aggregation: true
    metrics:
      resource_attributes_as_tags: true
      histograms:
        mode: distributions
    host_metadata:
      enabled: false
