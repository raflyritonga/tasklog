[sources.docker]
type = "docker_logs"
include_labels = ["com.docker.compose.project=tasklog"]

[transforms.parsed]
type = "remap"
inputs = ["docker"]
source = '''
parsed, err = parse_json(.message)
if err == null && is_object(parsed) {
  . = merge(., object!(parsed))
}
svc = string(.service) ?? ""
if svc == "" {
  svc = string(.label."com.docker.compose.service") ?? "unknown"
}
.service = svc
lvl = string(.level) ?? "info"
.level = downcase(lvl)
.trace_id = string(.trace_id) ?? ""
'''

[sinks.loki]
type = "loki"
inputs = ["parsed"]
endpoint = "http://loki:3100"
encoding.codec = "json"
dangerously_allow_unconfined_template_resolution = true

[sinks.loki.labels]
service = "{{ service }}"
level = "{{ level }}"
