apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tasklog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        ad.datadoghq.com/redis.checks: |
          {"redisdb":{"init_config":{},"instances":[{"host":"%%host%%","port":6379,"tags":["env:dev","project:tasklog"]}]}}
    spec:
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tasklog
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
