apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tasklog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/raflyritonga/tasklog-api:dev
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tasklog-db
                  key: DATABASE_URL
            - name: REDIS_ADDR
              value: redis:6379
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tasklog
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
