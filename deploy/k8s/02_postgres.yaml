apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: tasklog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: tasklog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pg
  template:
    metadata:
      labels:
        app: pg
      annotations:
        dynatrace.com/inject: "false"
        ad.datadoghq.com/postgres.checks: |
          {"postgres":{"init_config":{},"instances":[{"host":"%%host%%","port":5432,"username":"monitor","password":"%%env_PG_MONITOR_PASSWORD%%","dbname":"tasklog","dbm":true,"collect_schemas":{"enabled":true},"query_samples":{"enabled":true},"query_metrics":{"enabled":true},"relations":[{"relation_regex":".*"}],"tags":["env:dev","project:tasklog"]}]}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.10-alpine
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
          envFrom:
            - secretRef:
                name: tasklog-db
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: initdb
          configMap:
            name: pg-init
        - name: data
          persistentVolumeClaim:
            claimName: pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: tasklog
spec:
  selector:
    app: pg
  ports:
    - port: 5432
      targetPort: 5432
