apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tasklog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/raflyritonga/tasklog-web:dev
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: web-rum
                optional: true
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tasklog
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
