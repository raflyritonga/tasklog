apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: tasklog
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: postgres:16.10-alpine
          command:
            - psql
            - -c
            - select seed_tasks();
          env:
            - name: PGHOST
              value: pg
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: tasklog-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklog-db
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: tasklog-db
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
